Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
PidFile /run/clamav/clamd.pid
LogTime yes
LogClean no
ScanArchive yes
MaxFileSize 50M
StreamMaxLength 55M
MaxScanSize 60M
MaxScanTime 100000
MaxRecursion 16
MaxFiles 1000

# Incomplete archive/encrypted-content scans must never be treated as clean.
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
