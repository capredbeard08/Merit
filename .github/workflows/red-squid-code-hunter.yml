name: Red Squid Code Hunter

on:
  push:
    branches: [feat/red-squid-security-warden]
  pull_request:
    branches: [feat/red-squid-security-warden]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: red-squid-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Code Hunter · CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-hunter:
    name: Dependency Hunter · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile with approved non-breaking security updates
        run: rm -f package-lock.json && npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Preserve regenerated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-squid-regenerated-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

