name: MERIT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, integration/batch-1-security-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security tests, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: merit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d merit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/merit_ci
      AUTH_SECRET: ci-only-secret-not-for-production-0000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EMAIL_FROM: ci@example.invalid
      CRON_SECRET: ci-only-cron-secret-not-for-production-0000000000000000
      RECAPTCHA_SECRET_KEY: ci-only-recaptcha-secret-not-for-production-0000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Replay migrations on an empty PostgreSQL database
        run: npx prisma migrate deploy

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify tenant and retention database guards
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/tests/security-constraints.sql

      - name: Run Security Warden tests
        env:
          NODE_ENV: test
          MERIT_CI_AUTH_TESTS: "true"
        run: npm run test:security

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Type-check isolated security worker
        run: npm run test:security-worker

      - name: Build production application
        run: npm run build

  scanner-image:
    name: Build private Red Squid scanner image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scanner container (no push or deployment)
        run: docker build --pull -f security-worker/Dockerfile -t merit-red-squid:ci .

      - name: Run isolated ClamAV runtime smoke tests (no secrets or production access)
        run: docker run --rm --entrypoint /bin/sh merit-red-squid:ci /app/security-worker/container-smoke-test.sh
