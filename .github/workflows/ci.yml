name: MERIT CI

on:
  push:
    branches: [main, feat/platform-access-foundation, feat/guest-feedback-foundation, feat/red-squid-security-warden]
  pull_request:
    branches: [main, feat/explicit-workspace-selection, feat/platform-access-foundation, feat/guest-feedback-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security tests, TypeScript, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: merit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d merit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/merit_ci
      AUTH_SECRET: ci-only-secret-not-for-production-0000000000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EMAIL_FROM: ci@example.invalid
      CRON_SECRET: ci-only-cron-secret-not-for-production-0000000000000000
      RECAPTCHA_SECRET_KEY: ci-only-recaptcha-secret-not-for-production-0000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy

      - name: Run database-backed integration tests (support, guest feedback, Red Squid approvals and hunter queue)
        env:
          MERIT_CI_AUTH_TESTS: "true"
        run: npm run test:integration

      - name: Run Security Warden tests
        run: npm run test:security

      - name: Run Red Squid approval lifecycle integration tests
        run: npx tsx --test src/lib/security-warden-approvals.integration.test.ts

      - name: Type-check application TypeScript
        run: npx tsc --noEmit

      - name: Type-check Red Squid worker TypeScript
        run: npx tsc --noEmit -p tsconfig.security-worker.json

      - name: Test Red Squid scan verdict classification
        run: npx tsx --test security-worker/scan-verdict.test.ts

      - name: Build production application
        run: npm run build

  scanner-image:
    name: Build private Red Squid scanner image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scanner container (no push or deployment)
        run: docker build --pull -f security-worker/Dockerfile -t merit-red-squid:ci .

      - name: Run isolated ClamAV runtime smoke tests (no secrets or production access)
        run: docker run --rm --entrypoint /bin/sh merit-red-squid:ci /app/security-worker/container-smoke-test.sh
