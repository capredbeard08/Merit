name: MERIT database migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: "Type yes only after reviewing the migration diff and confirming a recoverable backup."
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: merit-production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm_production_migration == 'yes' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout the exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate production database configuration
        env:
          DATABASE_URL: ${{ secrets.MERIT_PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure MERIT_PRODUCTION_DATABASE_URL in the protected production environment."
            exit 1
          fi

      - name: Check migration status before applying
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.MERIT_PRODUCTION_DATABASE_URL }}

      - name: Apply pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.MERIT_PRODUCTION_DATABASE_URL }}

      - name: Verify migration status after applying
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.MERIT_PRODUCTION_DATABASE_URL }}
