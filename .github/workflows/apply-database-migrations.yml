name: MERIT apply database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merit-production-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed security-branch migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed migration branch
        uses: actions/checkout@v4
        with:
          ref: security/remediation-phase-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check migration status before applying
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.MERIT_DATABASE_URL }}

      - name: Apply pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.MERIT_DATABASE_URL }}

      - name: Verify migration status after applying
        run: npx prisma migrate status
        env:
          DATABASE_URL: ${{ secrets.MERIT_DATABASE_URL }}
